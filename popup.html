<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams Chat Archiver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <h1>Teams Chat Archiver</h1>
    <p class="hint">Archive the current Teams web chat into snapshots plus readable HTML pages.</p>

    <div class="actions quick-actions">
      <button id="open-teams-button" class="secondary-button" type="button">Open Teams Website</button>
    </div>

    <label class="toggle-field" for="include-images">
      <span class="field-label">Include pasted images</span>
      <input id="include-images" type="checkbox" checked>
    </label>

    <div class="actions">
      <button id="archive-chat-button" type="button">Archive Current Chat</button>
      <button id="archive-visible-button" type="button">Archive All Chats</button>
    </div>
    <div id="run-indicator" class="run-indicator is-idle" aria-live="polite">
      <span class="run-dot" aria-hidden="true"></span>
      <span id="run-label">Idle</span>
    </div>
    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
